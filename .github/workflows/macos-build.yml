name: macOS Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          brew update
          brew install coreutils qt@6 llvm

      - name: Build
        run: |
          git submodule update --init --recursive
          cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j $(nproc)

      - name: Run
        run: |
          ./build/Dots_and_Boxes -s 5 -b
