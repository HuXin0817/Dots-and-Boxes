name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          brew update
          brew install coreutils qt@6 llvm

      - name: Build
        run: |
          bash build.sh Debug

      - name: Run
        run: |
          ./build/Dots_and_Boxes -s 4
