name: build

on:
  push:
    branches: [main]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/CMakeLists.txt"
      - "build.sh"
  pull_request:
    branches: [main]
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/CMakeLists.txt"
      - "build.sh"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install requirements
        run: |
          brew update
          brew install qt@6 llvm

      - name: Build
        run: |
          bash build.sh Debug
